<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 보기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #d29922;
    --accent-dim: #9e6a03;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.7; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 32px 20px 80px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-bottom: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .topbar a { color: var(--text-dim); text-decoration: none; font-size: 13px; font-family: var(--mono);
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; }
  .topbar a:hover { border-color: var(--accent); color: var(--accent); }

  #md h1 { font-size: 24px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 0; }
  #md h2 { font-size: 19px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 36px; }
  #md h3 { font-size: 16px; margin-top: 28px; }
  #md h4 { font-size: 14px; margin-top: 22px; color: var(--text-dim); }
  #md p, #md li { font-size: 14.5px; }
  #md a { color: var(--accent); }
  #md code { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-family: var(--mono); font-size: 0.9em; }
  #md pre { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow-x: auto; }
  #md pre code { border: none; padding: 0; }
  #md blockquote { border-left: 3px solid var(--accent-dim); margin: 0; padding: 2px 16px; color: var(--text-dim); }
  #md table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13.5px; display: block; overflow-x: auto; }
  #md th, #md td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; vertical-align: top; }
  #md th { background: var(--bg-card); font-weight: 600; white-space: nowrap; }
  #md tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  #md img { max-width: 100%; border-radius: 6px; }
  #md hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
  #md input[type="checkbox"] { margin-right: 6px; }
  #md ul.contains-task-list { list-style: none; padding-left: 4px; }

  .err { color: #f85149; font-family: var(--mono); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="../index.html">← 포트폴리오로</a>
    <a id="raw-link" href="#">원본 마크다운 보기</a>
  </div>
  <div id="md">로딩 중…</div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const src = params.get('src');
  const mdEl = document.getElementById('md');
  const rawLink = document.getElementById('raw-link');

  if (!src) {
    mdEl.innerHTML = '<p class="err">?src= 파라미터가 없습니다.</p>';
  } else {
    rawLink.href = src;
    fetch(src)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(text => {
        document.title = (text.match(/^#\s+(.+)$/m) || [, '문서 보기'])[1];
        mdEl.innerHTML = marked.parse(text);
      })
      .catch(err => {
        mdEl.innerHTML = `<p class="err">문서를 불러오지 못했습니다 (${err.message}).</p>`;
      });
  }
</script>
</body>
</html>
